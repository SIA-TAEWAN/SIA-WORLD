name: Deploy to GitHub Pages

# SIA WORLD 전체(로비 + shared + 각 게임)를 한 사이트로 배포한다.
#   /              index.html (통합 로그인 + 로비), shared/
#   /games/tank/   시아탱크 빌드 결과 (games/tank/dist)
#   /games/running/ 시아레이스 빌드 결과 (games/running/dist)
#   /games/volleyball/ 시아배구 빌드 결과 (games/volleyball/dist)
#   /games/survival/ 시아서바이벌 빌드 결과 (games/survival/dist)
#   /games/defense/ 시아디펜스 빌드 결과 (games/defense/dist)
#   /games/village/ 시아마을 빌드 결과 (games/village/dist)
#   /games/charge/ 시아돌격대 빌드 결과 (games/charge/dist)
#   /games/finger/ 시아핑거 빌드 결과 (games/finger/dist)
#   /games/twelve/ 시아열두길 빌드 결과 (games/twelve/dist)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # SQL 실행 도중에 끊기지 않도록 앞선 배포를 취소하지 않는다
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            games/tank/package-lock.json
            games/package-lock.json
            games/running/package-lock.json
            games/volleyball/package-lock.json
            games/survival/package-lock.json
            games/defense/package-lock.json
            games/village/package-lock.json
            games/charge/package-lock.json
            games/finger/package-lock.json
            games/twelve/package-lock.json
      # shared/*.js 와 index.html 은 빌드를 거치지 않고 그대로 올라간다 → 문법 오류만이라도 배포 전에 잡는다
      - name: 로비·공용 코드 문법 검사
        run: |
          for f in shared/*.js; do node --check "$f" || exit 1; done
          # 앱(PWA) 서비스 워커: 최상위 sw.js 도 빌드 없이 그대로 올라간다
          node --check sw.js
          grep -q "__SW_VERSION__" sw.js || { echo 'sw.js 에 판본 자리(__SW_VERSION__)가 없어요'; exit 1; }
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          # index.html 의 인라인 스크립트를 꺼내 파일로 쓰고 각각 node --check (type=module 은 .mjs)
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import cp from 'node:child_process';
          const html = fs.readFileSync('index.html', 'utf8');
          const re = /<script(\s[^>]*)?>([\s\S]*?)<\/script>/gi;
          let m;
          let i = 0;
          while ((m = re.exec(html))) {
            const attrs = m[1] ?? '';
            if (/\ssrc\s*=/.test(attrs) || !m[2].trim()) continue;
            const ext = /type\s*=\s*["']?module/i.test(attrs) ? 'mjs' : 'cjs';
            const f = path.join(os.tmpdir(), `index-inline-${i++}.${ext}`);
            fs.writeFileSync(f, m[2]);
            cp.execFileSync(process.execPath, ['--check', f], { stdio: 'inherit' });
          }
          if (!i) throw new Error('index.html 에서 인라인 스크립트를 찾지 못했어요');
          console.log(`index.html 인라인 스크립트 ${i}개 문법 확인`);
          JS
          # index.html·shared/*.js 가 이름으로 가져오는 것이 그 공용 파일에 실제로 있는지 (없으면 브라우저에서 모듈 전체가 안 열린다)
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          // 이름을 붙여 가져오는 것(import { a, b as c } from './shared/x.js')이 그 파일에 실제로 export 돼 있는지
          const exportsOf = new Map();
          const exportNames = (file) => {
            if (exportsOf.has(file)) return exportsOf.get(file);
            const src = fs.readFileSync(file, 'utf8');
            const names = new Set();
            for (const m of src.matchAll(/^\s*export\s+(?:async\s+)?(?:function\s*\*?|const|let|var|class)\s+([\w$]+)/gm)) names.add(m[1]);
            for (const m of src.matchAll(/^\s*export\s*\{([^}]*)\}/gm))
              for (const part of m[1].split(',')) {
                const p = part.trim().split(/\s+as\s+/);
                if (p[0]) names.add((p[1] ?? p[0]).trim());
              }
            exportsOf.set(file, names);
            return names;
          };
          const sources = [['index.html', fs.readFileSync('index.html', 'utf8')]];
          for (const f of fs.readdirSync('shared')) if (f.endsWith('.js')) sources.push([`shared/${f}`, fs.readFileSync(`shared/${f}`, 'utf8')]);
          const bad = [];
          let n = 0;
          for (const [from, src] of sources) {
            const code = src.replace(/\/\*[\s\S]*?\*\//g, '').replace(/^\s*\/\/.*$/gm, '');
            for (const m of code.matchAll(/\bimport\s+(?:[\w$]+\s*,\s*)?\{([^}]*)\}\s*from\s*['"](\.{1,2}\/[^'"]+\.js)['"]/g)) {
              const target = path.posix.normalize(path.posix.join(path.posix.dirname(from), m[2]));
              if (!target.startsWith('shared/')) continue;
              if (!fs.existsSync(target)) {
                bad.push(`${from}: ${m[2]} 파일이 없어요`);
                continue;
              }
              const names = exportNames(target);
              for (const part of m[1].split(',')) {
                const name = part.trim().split(/\s+as\s+/)[0].trim();
                if (!name) continue;
                n++;
                if (!names.has(name)) bad.push(`${from}: '${name}' 이(가) ${target} 에 export 돼 있지 않아요`);
              }
            }
          }
          if (bad.length) {
            console.error(bad.join('\n'));
            process.exit(1);
          }
          if (!n) throw new Error('가져오는 이름을 하나도 찾지 못했어요');
          console.log(`공용 모듈 가져오기 ${n}개 확인`);
          JS
      - name: 시아탱크 테스트·빌드
        working-directory: games/tank
        run: |
          npm ci
          npm test
          npm run build
      - name: 시아맞고·시아카지노 규칙 엔진 테스트·빌드
        working-directory: games
        run: |
          npm ci
          npm test
          npm run build
      - name: 시아레이스 테스트·빌드
        working-directory: games/running
        run: |
          npm ci
          npm test
          npm run build
      - name: 시아배구 테스트·빌드
        working-directory: games/volleyball
        run: |
          npm ci
          npm test
          npm run build
      - name: 시아서바이벌 테스트·빌드
        working-directory: games/survival
        run: |
          npm ci
          npm test
          npm run build
      - name: 시아디펜스 테스트·빌드
        working-directory: games/defense
        run: |
          npm ci
          npm test
          npm run build
      - name: 시아마을 테스트·빌드
        working-directory: games/village
        run: |
          npm ci
          npm test
          npm run build
      - name: 시아돌격대 테스트·빌드
        working-directory: games/charge
        run: |
          npm ci
          npm test
          npm run build
      - name: 시아핑거 테스트·빌드
        working-directory: games/finger
        run: |
          npm ci
          npm test
          npm run build
      - name: 시아열두길 테스트·빌드
        working-directory: games/twelve
        run: |
          npm ci
          npm test
          npm run build
      - name: 사이트 파일 모으기
        run: |
          mkdir -p _site/games/tank _site/games/running _site/games/volleyball _site/games/survival _site/games/defense _site/games/village _site/games/charge _site/games/finger _site/games/twelve
          cp index.html _site/
          cp -r shared _site/
          # 앱(PWA): manifest·오프라인 화면·서비스 워커 (아이콘은 shared/images/app/ 에 있어 위에서 같이 복사된다)
          cp manifest.webmanifest offline.html _site/
          # 서비스 워커 판본 = 이번 커밋 → 배포마다 sw.js 내용이 바뀌어 브라우저가 새 판본을 받고 예전 캐시를 지운다
          sed "s/__SW_VERSION__/${GITHUB_SHA}/" sw.js > _site/sw.js
          grep -q "$GITHUB_SHA" _site/sw.js
          test -f _site/shared/images/app/icon-512.png
          cp -r games/tank/dist/. _site/games/tank/
          cp -r games/dist/. _site/games/
          cp -r games/running/dist/. _site/games/running/
          cp -r games/volleyball/dist/. _site/games/volleyball/
          cp -r games/survival/dist/. _site/games/survival/
          cp -r games/defense/dist/. _site/games/defense/
          cp -r games/village/dist/. _site/games/village/
          cp -r games/charge/dist/. _site/games/charge/
          cp -r games/finger/dist/. _site/games/finger/
          cp -r games/twelve/dist/. _site/games/twelve/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # supabase/migrations/ 에서 아직 실행 안 된 SQL만 서버에 실행한다 (SIA WORLD 공용 DB)
  migrate:
    needs: build
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # 세션 풀러 주소 (비밀번호 자리는 시크릿에서 채운다)
      DB_HOST: aws-0-ap-southeast-2.pooler.supabase.com
      DB_USER: postgres.ssbopykmgqrjrrtfespm
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - name: 접속 주소 만들기
        run: |
          PW=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')
          echo "::add-mask::$PW"
          echo "DB_URL=postgresql://$DB_USER:$PW@$DB_HOST:5432/postgres" >> "$GITHUB_ENV"
      - run: supabase db push --remote "$DB_URL" --yes
      - run: supabase migration list --remote "$DB_URL"

  # Edge Function 배포 (게임 딜러 game-action, 시간 초과 game-timeout, 시아핑거 판 검증 finger-finish)
  functions:
    needs: migrate
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ssbopykmgqrjrrtfespm
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      # 함수 배포는 잠깐의 API 오류로 실패할 때가 있어 60초 뒤 다시 시도한다 (모두 3번까지. db push 는 다시 시도하지 않는다)
      - name: Edge Function 배포
        run: |
          deploy_fn() {
            for try in 1 2 3; do
              if supabase functions deploy "$@"; then return 0; fi
              if [ "$try" -lt 3 ]; then echo "::warning::$1 배포 실패 ($try/3) — 60초 뒤 다시 시도"; sleep 60; fi
            done
            echo "::error::$1 배포 3번 모두 실패"
            return 1
          }
          deploy_fn game-action --project-ref "$PROJECT_REF" --use-api --yes
          # cron(pg_net)이 사용자 JWT 없이 부르므로 JWT 확인을 끄고, 함수 안에서 DB 비밀값으로 확인한다
          deploy_fn game-timeout --project-ref "$PROJECT_REF" --use-api --no-verify-jwt --yes
          # 시아핑거 판 결과: 화면이 사용자 JWT 로 부른다 (JWT 확인은 켠 채로)
          deploy_fn finger-finish --project-ref "$PROJECT_REF" --use-api --yes

  deploy:
    needs: [build, migrate, functions]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
