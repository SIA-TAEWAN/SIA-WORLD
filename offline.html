<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4aa8ff" />
  <title>SIA WORLD</title>
  <!-- 글꼴은 서비스 워커가 캐시해 둔 것이 있으면 그것으로, 없으면 기기 글꼴 -->
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <style>
    /* 인터넷이 끊겼을 때 서비스 워커(sw.js)가 대신 보여 주는 화면. 다른 파일 없이 혼자 뜬다 (값은 shared/theme.css 와 같게) */
    :root {
      --sky-top: #4aa8ff; --sky-mid: #9fd6ff; --sky-bottom: #ffe9b8; --sky-deep: #1f6fd1;
      --panel: #fff8e8; --outline: #2a1a10; --ink: #2a1a10; --ink-soft: #8a6a4a;
      --primary-light: #ffe066; --primary-deep: #f0a500; --white: #ffffff;
      --font: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font); color: var(--ink); min-height: 100vh;
      background: linear-gradient(var(--sky-top), var(--sky-mid) 300px, var(--sky-bottom)); background-attachment: fixed;
      display: grid; place-items: center;
      padding: calc(24px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px))
        calc(24px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
    }
    .card {
      width: 100%; max-width: 360px; text-align: center; background: var(--panel);
      border: 4px solid var(--outline); border-radius: 28px; padding: 24px 22px 22px; box-shadow: 0 8px 0 var(--outline);
    }
    .card img { width: 96px; height: 96px; display: block; margin: 0 auto 8px; }
    .card img[hidden] { display: none; }
    h1 { margin: 0; font-size: 24px; font-weight: normal; word-break: keep-all; }
    p { margin: 8px 0 0; color: var(--ink-soft); font-size: 15px; line-height: 1.45; }
    button {
      display: block; width: 100%; margin-top: 18px; padding: 12px; font: inherit; font-size: 22px; color: var(--ink); cursor: pointer;
      background: linear-gradient(var(--primary-light), var(--primary-deep)); border: 3px solid var(--outline); border-radius: 16px;
      box-shadow: 0 5px 0 var(--outline); transition: transform 80ms, box-shadow 80ms;
    }
    button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--outline); }
    button:focus-visible { outline: 3px solid var(--sky-deep); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
  </style>
</head>
<body>
  <main class="card">
    <img id="icon" alt="" hidden />
    <h1>인터넷 연결을 확인해 주세요</h1>
    <p>연결되면 다시 시도를 눌러 주세요.</p>
    <button type="button" id="retry">다시 시도</button>
  </main>
  <script>
    // 이 화면은 게임 주소(/games/tank/ 등)에서도 뜬다 → 그림은 서비스 워커 위치(사이트 최상위) 기준으로 찾는다
    (function () {
      var img = document.getElementById('icon');
      try {
        var sw = navigator.serviceWorker && navigator.serviceWorker.controller;
        if (sw) {
          img.onload = function () { img.hidden = false; };
          img.src = new URL('shared/images/app/icon-192.png', sw.scriptURL).href;
        }
      } catch (e) { /* 그림 없이 */ }
      document.getElementById('retry').addEventListener('click', function () { location.reload(); });
      window.addEventListener('online', function () { location.reload(); });
    })();
  </script>
</body>
</html>
