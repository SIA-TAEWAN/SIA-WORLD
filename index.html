<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4aa8ff" />
  <title>SIA WORLD</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌏</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./shared/theme.css" />
  <style>
    /* SIA WORLD 로비. DESIGN.md를 따른다 — 값은 shared/theme.css의 변수만 쓴다 */
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font); font-size: var(--fs-body); color: var(--ink);
      background: var(--sky-gradient); background-attachment: fixed; min-height: 100vh;
    }
    button, input { font: inherit; }
    .hidden { display: none !important; }

    /* ---------- 로그인 / 회원가입 (시아탱크 .entry-card) ---------- */
    .auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .auth-card {
      width: 100%; max-width: 400px; background: var(--panel); border: var(--line-big) solid var(--outline);
      border-radius: var(--radius-panel-big); padding: 24px 22px 20px; box-shadow: 0 var(--depth-big) 0 var(--outline);
    }
    .brand { text-align: center; margin-bottom: 14px; }
    .brand img { width: 96px; height: 96px; object-fit: contain; }
    .brand h1 { margin: 0; font-size: 48px; font-weight: normal; color: var(--primary); letter-spacing: 1px;
      -webkit-text-stroke: 3px var(--outline); paint-order: stroke fill; text-shadow: 0 5px 0 var(--outline); }
    .brand h1 b { color: var(--white); font-weight: inherit; }
    .brand p { margin: 6px 0 0; color: var(--ink-soft); font-size: 15px; }
    .field { display: block; margin: 10px 0; }
    .field > span { display: block; font-size: 14px; color: var(--ink-soft); margin: 0 0 4px 4px; }
    .field input {
      width: 100%; padding: 11px 14px; border-radius: var(--radius-item); border: var(--line-thin) solid var(--outline);
      font-size: 17px; outline: none; background: var(--white); color: var(--ink);
    }
    .field input:focus { box-shadow: 0 0 0 var(--line) var(--primary); }
    .field.bad input { border-color: var(--pink); }
    .msg { font-size: 13px; margin: 4px 0 0 4px; color: var(--pink); }
    .msg.ok { color: var(--win); }
    .legacy { background: var(--panel-strong); border: var(--line-thin) dashed var(--empty-line); border-radius: var(--radius-item); padding: 8px 12px 4px; margin: 12px 0; }
    .legacy p { margin: 2px 0 4px; font-size: 14px; color: var(--ink-soft); }
    .btn {
      display: block; width: 100%; border: var(--line) solid var(--outline); border-radius: var(--radius-button); padding: 12px; font-size: var(--fs-button-big);
      cursor: pointer; background: var(--primary-gradient); color: var(--ink); box-shadow: 0 5px 0 var(--outline);
      margin-top: 14px; transition: transform var(--press-ms), box-shadow var(--press-ms);
    }
    .btn:active:not(:disabled) { transform: translateY(var(--press)); box-shadow: 0 1px 0 var(--outline); }
    .btn:disabled { opacity: .55; cursor: default; }
    .btn:focus-visible { outline: var(--line) solid var(--sky-deep); outline-offset: 2px; }
    .form-err { text-align: center; color: var(--pink); font-size: 15px; min-height: 20px; margin: 10px 0 0; }
    .switch { text-align: center; margin: 14px 0 0; font-size: 15px; color: var(--ink-soft); }
    .link { background: none; border: none; color: var(--sky-deep); cursor: pointer; padding: 0; text-decoration: underline; font-size: inherit; }

    /* ---------- 로비 ---------- */
    .top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; color: var(--white); }
    .top .logo { font-size: 30px; margin: 0; flex: 1; white-space: nowrap; font-weight: normal; color: var(--primary);
      -webkit-text-stroke: 2px var(--outline); paint-order: stroke fill; text-shadow: 0 3px 0 var(--outline); }
    .top .logo b { color: var(--white); font-weight: inherit; }
    .top .me { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--pill); color: var(--white); padding: 5px 12px; border-radius: var(--radius-item); }
    .small { width: auto; display: inline-block; margin: 0; padding: 5px 12px; font-size: 15px; border-radius: var(--radius-item);
      background: var(--white); color: var(--ink); box-shadow: 0 3px 0 var(--outline); }
    .small:active:not(:disabled) { box-shadow: 0 1px 0 var(--outline); }
    main.lobby { max-width: 960px; margin: 0 auto; padding: 8px 16px 40px; }
    main.lobby h2 { margin: 0 0 12px; font-size: var(--fs-title); font-weight: normal; color: var(--white);
      -webkit-text-stroke: 2px var(--outline); paint-order: stroke fill; }
    .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .game-card {
      display: block; text-decoration: none; color: inherit; background: var(--panel);
      border: var(--line) solid var(--outline); border-radius: var(--radius-panel); overflow: hidden;
      box-shadow: 0 var(--depth-panel) 0 var(--outline); transition: transform var(--press-ms), box-shadow var(--press-ms);
    }
    .game-card:active { transform: translateY(var(--press)); box-shadow: 0 1px 0 var(--outline); }
    .game-card:focus-visible { outline: var(--line) solid var(--sky-deep); outline-offset: 2px; }
    .game-card img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; background: var(--sky-mid); border-bottom: var(--line) solid var(--outline); }
    .game-card .gi { padding: 10px 14px 14px; }
    .game-card h3 { margin: 0; font-size: var(--fs-panel); font-weight: normal; }
    .game-card p { margin: 4px 0 0; color: var(--ink-soft); font-size: 14px; }
    .center { min-height: 100vh; display: grid; place-items: center; color: var(--white); font-size: 18px; -webkit-text-stroke: 1px var(--outline); paint-order: stroke fill; }

    /* 지갑 · 출석 · 랭킹 */
    .notice { background: var(--panel-strong); border: var(--line) solid var(--outline); color: var(--ink); border-radius: var(--radius-item);
      padding: 10px 14px; margin: 0 0 14px; font-size: 17px; text-align: center; box-shadow: 0 3px 0 var(--outline); animation: pop .35s ease-out; }
    @keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
    .wallet { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; margin: 0 0 22px; }
    .pill { flex: 1 1 220px; display: flex; align-items: center; gap: 10px; background: var(--panel);
      border: var(--line) solid var(--outline); border-radius: var(--radius-button); padding: 10px 12px; box-shadow: 0 var(--depth-button) 0 var(--outline); }
    .pill .ic { font-size: 28px; }
    .pill .amt { flex: 1; min-width: 0; }
    .pill small { display: block; color: var(--ink-soft); font-size: 13px; }
    .pill b { font-size: 24px; font-weight: normal; color: var(--accent); }
    .pill .left { display: block; color: var(--ink-soft); font-size: 12px; }
    .pill .small:disabled { opacity: .45; }
    #rank-btn { flex: 0 0 auto; align-self: center; }
    .note { color: var(--pink); font-size: 14px; margin: -14px 0 16px; }
    dialog.rank { border: var(--line-big) solid var(--outline); border-radius: var(--radius-panel-big); padding: 16px; width: min(460px, calc(100% - 32px));
      max-height: calc(100% - 40px); color: var(--ink); font-family: inherit; background: var(--panel); box-shadow: 0 var(--depth-big) 0 var(--outline); }
    dialog.rank::backdrop { background: var(--dim); }
    .rank-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .rank-head h3 { margin: 0; font-size: 22px; font-weight: normal; }
    .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
    .tabs { flex-wrap: wrap; }
    .tabs button { flex: 1; min-width: 90px; border: var(--line-thin) solid var(--outline); background: var(--white); border-radius: var(--radius-item); padding: 7px 4px; cursor: pointer; font-size: 14px; color: var(--ink); }
    .tabs button.sel { background: var(--primary); box-shadow: 0 3px 0 var(--outline); }
    .rank-me { text-align: center; font-size: 15px; margin: 6px 0; }
    .rank-list { max-height: 55vh; overflow-y: auto; border-top: var(--line-thin) dashed var(--line-soft); }
    .rank-list table { width: 100%; border-collapse: collapse; }
    .rank-list td { padding: 6px; border-bottom: var(--line-thin) dashed var(--line-soft); font-size: 16px; }
    .rank-list td.pl { width: 36px; text-align: center; }
    .rank-list td.nm { width: 100%; }
    .rank-list td.am { white-space: nowrap; text-align: right; color: var(--accent); }
    .rank-list tr.me { background: var(--panel-strong); color: var(--ink); }
    .rank-list tr.me .nm { color: var(--sky-deep); }
    .games-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .games-head { margin-bottom: 12px; }
    main.lobby .games-head h2 { margin: 0 auto 0 0; }
    .rank-note { font-size: 12px; color: var(--ink-soft); text-align: center; margin: 8px 0 0; }
    @media (max-width: 420px) {
      .top .logo { font-size: 24px; }
      .brand h1 { font-size: 40px; }
    }
    @media (prefers-reduced-motion: reduce) { .btn:active, .game-card:active { transform: none; } .notice { animation: none; } }
  </style>
</head>
<body>
  <div id="loading" class="center">불러오는 중…</div>

  <!-- 로그인 -->
  <div id="login-view" class="auth-wrap hidden">
    <form class="auth-card" id="login-form" novalidate>
      <div class="brand"><img src="shared/images/zodiac/full/tiger.png" alt="" /><h1>SIA <b>WORLD</b></h1><p>로그인하고 친구들과 놀아요</p></div>
      <label class="field"><span>아이디</span>
        <input id="li-id" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="16" /></label>
      <label class="field"><span>비밀번호</span>
        <input id="li-pw" type="password" autocomplete="current-password" /></label>
      <p class="form-err" id="li-err"></p>
      <button class="btn" id="li-btn">로그인</button>
      <p class="switch">처음이에요? <button type="button" class="link" id="to-signup">회원가입</button></p>
    </form>
  </div>

  <!-- 회원가입 -->
  <div id="signup-view" class="auth-wrap hidden">
    <form class="auth-card" id="signup-form" novalidate>
      <div class="brand"><img src="shared/images/zodiac/full/rabbit.png" alt="" /><h1>SIA <b>WORLD</b></h1><p>회원가입</p></div>
      <label class="field" data-f="loginId"><span>아이디 (영문 소문자·숫자 4~16자)</span>
        <input id="su-id" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="16" />
        <p class="msg"></p></label>
      <label class="field" data-f="password"><span>비밀번호 (6자 이상)</span>
        <input id="su-pw" type="password" autocomplete="new-password" /><p class="msg"></p></label>
      <label class="field" data-f="password2"><span>비밀번호 확인</span>
        <input id="su-pw2" type="password" autocomplete="new-password" /><p class="msg"></p></label>
      <label class="field" data-f="nickname"><span>닉네임 (한글·영문·숫자 2~8자)</span>
        <input id="su-nick" maxlength="8" autocomplete="nickname" /><p class="msg"></p></label>
      <div class="legacy hidden" id="legacy">
        <p>🏆 이 아이디로 된 예전 시아탱크 랭킹 기록이 있어요.<br />예전 비밀번호를 넣으면 기록을 이어받아요. (선택)</p>
        <label class="field" data-f="legacy"><span>예전 시아탱크 비밀번호</span>
          <input id="su-legacy" type="password" autocomplete="off" /><p class="msg"></p></label>
      </div>
      <p class="form-err" id="su-err"></p>
      <button class="btn" id="su-btn">가입하기</button>
      <p class="switch">이미 계정이 있어요 <button type="button" class="link" id="to-login">로그인</button></p>
    </form>
  </div>

  <!-- 로비 -->
  <div id="lobby-view" class="hidden">
    <header class="top">
      <h1 class="logo">SIA <b>WORLD</b></h1>
      <span class="me" id="me"></span>
      <button class="btn small" id="logout">로그아웃</button>
    </header>
    <main class="lobby">
      <div class="notice hidden" id="attend">🎁 오늘의 출석 보너스! 칩 +10,000 · 냥 +10,000</div>
      <section class="wallet">
        <div class="pill"><span class="ic">🪙</span>
          <span class="amt"><small>카지노 칩</small><b id="w-chips">-</b><span class="left" id="l-chips"></span></span>
          <button class="btn small refill" data-c="chips" disabled>무료 충전</button></div>
        <div class="pill"><span class="ic">💰</span>
          <span class="amt"><small>맞고 냥</small><b id="w-nyang">-</b><span class="left" id="l-nyang"></span></span>
          <button class="btn small refill" data-c="nyang" disabled>무료 충전</button></div>
      </section>
      <p class="note" id="w-note"></p>
      <div class="games-head"><h2>게임</h2><button class="btn small" id="rank-btn">🏆 랭킹</button></div>
      <div class="games" id="games"></div>
    </main>
  </div>

  <dialog class="rank" id="rank">
    <div class="rank-head"><h3>🏆 랭킹</h3><button class="btn small" id="rank-close">닫기</button></div>
    <div class="tabs"><button data-g="tank" class="sel">💣 시아탱크</button><button data-g="target">🎯 백발백중</button><button data-g="casino">🪙 카지노</button><button data-g="matgo">💰 맞고</button></div>
    <p class="rank-me" id="rank-me"></p>
    <div class="rank-list"><table id="rank-table"></table></div>
    <p class="rank-note" id="rank-note"></p>
  </dialog>

  <script type="module">
    import {
      signIn, signUp, signOut, getCurrentUser, safeRedirect, checkLegacy,
      isLoginIdTaken, isNicknameTaken, loginIdProblem, nicknameProblem, passwordProblem, AuthError,
    } from './shared/auth.js';
    import { GAMES } from './shared/games.js';
    import { claimAttendance, refill, canRefill, getRanking, formatAmount, RANKINGS, REFILLS_PER_DAY } from './shared/wallet.js';
    import { withTiers, tierSvg } from './shared/rank.js';

    const $ = (s) => document.querySelector(s);
    const views = ['loading', 'login-view', 'signup-view', 'lobby-view'];
    const show = (id) => views.forEach((v) => $('#' + v).classList.toggle('hidden', v !== id));

    const params = new URLSearchParams(location.search);
    const redirect = safeRedirect(params.get('redirect'));

    /** 로그인 성공 → redirect가 있으면 그곳으로, 없으면 로비 */
    function afterLogin(user) {
      if (redirect) return location.replace(redirect);
      // 주소에 남은 ?redirect=... 는 지운다
      if (location.search) history.replaceState(null, '', location.pathname);
      showLobby(user);
    }

    // ---------- 로비 ----------
    function showLobby(user) {
      $('#me').textContent = `${user.nickname}님`;
      const box = $('#games');
      box.replaceChildren(
        ...GAMES.filter((g) => g.open).map((g) => {
          const a = document.createElement('a');
          a.className = 'game-card';
          a.href = g.path;
          const img = document.createElement('img');
          img.src = g.image; img.alt = ''; img.loading = 'lazy';
          const info = document.createElement('div');
          info.className = 'gi';
          const h = document.createElement('h3'); h.textContent = g.name;
          const p = document.createElement('p'); p.textContent = g.desc;
          info.append(h, p);
          a.append(img, info);
          return a;
        }),
      );
      show('lobby-view');
      void loadWallet(user);
    }

    // ---------- 지갑 · 출석 · 무료 충전 ----------
    // 로비에서의 충전은 가장 작은 방(기본 단위 100, 최소 입장 5,000) 기준
    const LOBBY_BASE_UNIT = 100;
    let me = null;
    let wallet = null;
    function renderWallet() {
      for (const c of ['chips', 'nyang']) {
        $('#w-' + c).textContent = wallet ? formatAmount(wallet[c]) : '-';
        const left = wallet?.[c + 'RefillsLeft'];
        $('#l-' + c).textContent = wallet ? `무료 충전 오늘 ${left}/${REFILLS_PER_DAY}번 남음` : '';
        $(`.refill[data-c="${c}"]`).disabled = !canRefill(wallet, c, LOBBY_BASE_UNIT);
      }
    }
    async function loadWallet(user) {
      me = user;
      $('#w-note').textContent = '';
      $('#attend').classList.add('hidden');
      try {
        // 출석 확인 (지갑이 없으면 이때 10,000 / 10,000으로 만들어진다)
        wallet = await claimAttendance();
        if (wallet.granted) $('#attend').classList.remove('hidden');
      } catch {
        wallet = null;
        $('#w-note').textContent = '지갑을 불러오지 못했어요. 새로고침해 주세요';
      }
      renderWallet();
    }
    document.querySelectorAll('.refill').forEach((b) =>
      b.addEventListener('click', async () => {
        b.disabled = true;
        $('#w-note').textContent = '';
        try {
          const r = await refill(b.dataset.c, LOBBY_BASE_UNIT);
          wallet = r;
          if (!r.ok) $('#w-note').textContent = r.reason === 'limit' ? '오늘 무료 충전을 모두 썼어요 (하루 3번)' : '아직 충분해요. 5,000보다 적을 때 충전할 수 있어요';
        } catch {
          $('#w-note').textContent = '충전하지 못했어요. 잠시 후 다시 시도해 주세요';
        }
        renderWallet();
      }),
    );

    // ---------- 랭킹 (카지노 칩 / 맞고 냥 따로) ----------
    const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ESC[c]);
    async function showRanking(game) {
      document.querySelectorAll('#rank .tabs button').forEach((b) => b.classList.toggle('sel', b.dataset.g === game));
      const info = RANKINGS[game];
      const unit = info.unit;
      $('#rank-note').textContent = `${info.note} · 해 상위 10% · 달 30% · 별 60% · 그 외 구름 (${formatAmount(info.base)}${unit} 이하는 구름)`;
      $('#rank-me').textContent = '불러오는 중…';
      $('#rank-table').innerHTML = '';
      try {
        const rows = withTiers(await getRanking(game), info.base);
        const mine = rows.find((r) => r.key === me?.userId);
        $('#rank-me').innerHTML = mine
          ? `내 순위 <b>${mine.place}위</b> / ${rows.length}명 · ${tierSvg(mine.tier, 20)} · ${formatAmount(mine.amount)}${unit}`
          : '아직 순위가 없어요';
        $('#rank-table').innerHTML = rows.slice(0, 100).map((r) =>
          `<tr class="${r.key === me?.userId ? 'me' : ''}"><td class="pl">${r.place}</td><td>${tierSvg(r.tier, 26)}</td>` +
          `<td class="nm">${esc(r.nickname)}</td><td class="am">${formatAmount(r.amount)}${unit}</td></tr>`).join('') ||
          '<tr><td>아직 랭킹이 없어요</td></tr>';
      } catch {
        $('#rank-me').textContent = '랭킹을 불러오지 못했어요';
      }
    }
    $('#rank-btn').addEventListener('click', () => {
      $('#rank').showModal();
      void showRanking('tank');
    });
    $('#rank-close').addEventListener('click', () => $('#rank').close());
    document.querySelectorAll('#rank .tabs button').forEach((b) => b.addEventListener('click', () => void showRanking(b.dataset.g)));
    $('#logout').addEventListener('click', async () => {
      await signOut();
      showLogin();
    });

    // ---------- 로그인 ----------
    function showLogin() {
      $('#li-err').textContent = '';
      $('#li-pw').value = '';
      show('login-view');
      $('#li-id').focus();
    }
    $('#li-id').addEventListener('input', (e) => (e.target.value = e.target.value.toLowerCase()));
    $('#login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('#li-btn');
      if (btn.disabled) return;
      btn.disabled = true;
      $('#li-err').textContent = '';
      try {
        afterLogin(await signIn($('#li-id').value, $('#li-pw').value));
      } catch (err) {
        $('#li-err').textContent = err instanceof AuthError ? err.message : '아이디 또는 비밀번호가 맞지 않아요';
      } finally {
        btn.disabled = false;
      }
    });
    $('#to-signup').addEventListener('click', () => {
      show('signup-view');
      $('#su-id').focus();
    });
    $('#to-login').addEventListener('click', showLogin);

    // ---------- 회원가입 ----------
    const field = (f) => document.querySelector(`#signup-form [data-f="${f}"]`);
    function setMsg(f, text, ok = false) {
      const el = field(f);
      el.classList.toggle('bad', !!text && !ok);
      const m = el.querySelector('.msg');
      m.textContent = text || '';
      m.classList.toggle('ok', ok);
    }
    const clearAll = () => ['loginId', 'password', 'password2', 'nickname', 'legacy'].forEach((f) => setMsg(f, ''));

    // 칸을 벗어나면 바로 확인 (아이디·닉네임 중복, 예전 기록)
    let checkedId = '';
    $('#su-id').addEventListener('input', (e) => {
      e.target.value = e.target.value.toLowerCase();
      setMsg('loginId', '');
    });
    $('#su-id').addEventListener('blur', async () => {
      const v = $('#su-id').value.trim();
      if (!v) return;
      const prob = loginIdProblem(v);
      if (prob) return setMsg('loginId', prob);
      if (v === checkedId) return;
      checkedId = v;
      try {
        if (await isLoginIdTaken(v)) return setMsg('loginId', '이미 있는 아이디예요');
        setMsg('loginId', '쓸 수 있는 아이디예요', true);
        const legacy = (await checkLegacy(v)) !== 'none';
        $('#legacy').classList.toggle('hidden', !legacy);
        if (!legacy) $('#su-legacy').value = '';
      } catch { /* 가입할 때 다시 확인 */ }
    });
    $('#su-nick').addEventListener('input', () => setMsg('nickname', ''));
    $('#su-nick').addEventListener('blur', async () => {
      const v = $('#su-nick').value.trim();
      if (!v) return;
      const prob = nicknameProblem(v);
      if (prob) return setMsg('nickname', prob);
      try {
        setMsg('nickname', ...((await isNicknameTaken(v)) ? ['이미 있는 닉네임이에요'] : ['쓸 수 있는 닉네임이에요', true]));
      } catch { /* 가입할 때 다시 확인 */ }
    });
    $('#su-pw').addEventListener('input', () => setMsg('password', ''));
    $('#su-pw').addEventListener('blur', () => $('#su-pw').value && setMsg('password', passwordProblem($('#su-pw').value)));
    $('#su-pw2').addEventListener('input', () => setMsg('password2', ''));
    $('#su-legacy').addEventListener('input', () => setMsg('legacy', ''));

    $('#signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('#su-btn');
      if (btn.disabled) return;
      btn.disabled = true;
      clearAll();
      $('#su-err').textContent = '';
      const loginId = $('#su-id').value.trim();
      const legacyPassword = $('#legacy').classList.contains('hidden') ? '' : $('#su-legacy').value;
      try {
        // 예전 비밀번호를 넣었으면 가입 전에 맞는지 먼저 확인 (틀리면 가입하지 않고 다시 입력)
        if (legacyPassword && loginIdProblem(loginId) === null && (await checkLegacy(loginId, legacyPassword)) !== 'ok') {
          throw new AuthError('예전 비밀번호가 맞지 않아요 (비워 두면 기록 없이 가입해요)', 'legacy');
        }
        const { user, claimed } = await signUp({
          loginId,
          password: $('#su-pw').value,
          password2: $('#su-pw2').value,
          nickname: $('#su-nick').value,
          legacyPassword,
        });
        if (claimed > 0) alert('예전 시아탱크 랭킹 기록을 이어받았어요!');
        afterLogin(user);
      } catch (err) {
        if (err instanceof AuthError && err.field) {
          setMsg(err.field, err.message);
          field(err.field).querySelector('input').focus();
        } else {
          $('#su-err').textContent = err instanceof AuthError ? err.message : '가입하지 못했어요. 잠시 후 다시 시도해 주세요';
        }
      } finally {
        btn.disabled = false;
      }
    });

    // ---------- 시작 ----------
    try {
      const user = await getCurrentUser();
      if (user) afterLogin(user);
      else showLogin();
    } catch {
      showLogin();
    }
  </script>
</body>
</html>
